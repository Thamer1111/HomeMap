<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <!-- التعديل الأول: منع تكبير الصفحة الأساسية عن طريق الخطأ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* التعديل الثاني: استخدام dvh بدلاً من vh فقط لحل مشكلة شريط الرابط */
            height: 100vh; /* متصفحات قديمة */
            height: 100dvh; /* متصفحات حديثة: يتأقلم مع شريط الرابط */
            overflow: hidden;
            /* التعديل الثالث: منع الشاشة الأساسية من التفاعل مع سحب الإصبع */
            touch-action: none; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none; 
            display: block; 
        }
    </style>
</head>

<body>
    <iframe 
        title="Mappedin Map" 
        name="Mappedin Map"
        allow="clipboard-write 'self' https://app.mappedin.com; web-share 'self' https://app.mappedin.com"
        src="https://app.mappedin.com/map/6aa406ad73edd3000b22737c?embedded=true">
    </iframe>
</body>

</html>
